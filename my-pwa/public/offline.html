
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <title>You are offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    main {
      max-width: 420px;
      padding: 32px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: #111;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>Please reconnect to the internet and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
